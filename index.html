    <meta name="description" content="تطبيق موبايل لإدارة منتجات المتجر مع مساعد ذكاء اصطناعي ومصادقة جوجل وذاكرة دائمة" />
    <meta property="og:title" content="Mobile Store - تطبيق المتجر" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <script>
      (function() {
        try {
          var t = localStorage.getItem('store_app_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
